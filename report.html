<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Election Realtime Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Kanit", sans-serif;
      }

      body {
        margin: 0;

        min-height: 100vh;

        background: linear-gradient(135deg, #0f172a, #111827, #1e293b);

        overflow: hidden;

        color: white;
      }

      .bg-glow {
        position: fixed;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        filter: blur(120px);

        opacity: 0.15;

        z-index: 0;
      }

      .glow1 {
        background: #3b82f6;
        top: -150px;
        left: -150px;
      }

      .glow2 {
        background: #22c55e;
        bottom: -150px;
        right: -150px;
      }

      .dashboard {
        position: relative;
        z-index: 1;

        padding: 40px;

        height: 100vh;

        display: flex;
        flex-direction: column;
      }

      .header {
        text-align: center;

        margin-bottom: 30px;
      }

      .title {
        font-size: 64px;

        font-weight: 800;

        letter-spacing: 2px;
      }

      .subtitle {
        color: #cbd5e1;

        font-size: 24px;

        margin-top: 10px;
      }

      .main-content {
        flex: 1;

        display: grid;

        grid-template-columns: 1fr 420px;

        gap: 30px;
      }

      .candidate-section {
        display: flex;

        gap: 30px;
      }

      .candidate-card {
        flex: 1;

        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 40px;

        padding: 30px;

        backdrop-filter: blur(20px);

        text-align: center;

        position: relative;

        overflow: hidden;
      }

      .candidate-image {
        width: 220px;
        height: 220px;

        object-fit: cover;

        border-radius: 50%;

        border: 8px solid rgba(255, 255, 255, 0.15);

        margin-bottom: 20px;
      }

      .candidate-number {
        position: absolute;

        top: 25px;
        left: 25px;

        width: 70px;
        height: 70px;

        border-radius: 20px;

        background: #2563eb;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 34px;
        font-weight: bold;
      }

      .candidate-name {
        font-size: 42px;

        font-weight: 700;

        margin-bottom: 15px;
      }

      .vote-count {
        font-size: 110px;

        font-weight: 800;

        line-height: 1;

        color: #4ade80;

        margin-top: 20px;

        transition: 0.2s;
      }

      .vote-label {
        font-size: 28px;

        color: #cbd5e1;
      }

      .side-panel {
        display: flex;
        flex-direction: column;
        gap: 25px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.08);

        border: 1px solid rgba(255, 255, 255, 0.1);

        border-radius: 30px;

        padding: 30px;

        backdrop-filter: blur(20px);
      }

      .panel-title {
        font-size: 28px;

        font-weight: 700;

        margin-bottom: 20px;
      }

      .total-vote {
        text-align: center;
      }

      .total-number {
        font-size: 110px;

        font-weight: 800;

        color: #facc15;

        line-height: 1;
      }

      .recent-list {
        max-height: 350px;

        overflow: auto;
      }

      .recent-item {
        display: flex;

        align-items: center;

        gap: 12px;

        padding: 14px 0;

        border-bottom: 1px solid rgba(255, 255, 255, 0.08);

        font-size: 20px;
      }

      .check {
        width: 40px;
        height: 40px;

        border-radius: 50%;

        background: #22c55e;

        display: flex;
        align-items: center;
        justify-content: center;

        font-weight: bold;

        flex-shrink: 0;
      }

      .pulse {
        animation: pulse 0.4s;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.06);
        }

        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-glow glow1"></div>
    <div class="bg-glow glow2"></div>

    <div class="dashboard">
      <div class="header">
        <div class="title">🗳️ ELECTION REALTIME</div>

        <div class="subtitle">ระบบแสดงผลการเลือกตั้งแบบเรียลไทม์</div>
      </div>

      <div class="main-content">
        <!-- LEFT -->
        <div class="candidate-section">
          <!-- Candidate 1 -->
          <div class="candidate-card">
            <div class="candidate-number">1</div>

            <img
                src="img/profile1.png"
              class="candidate-image"
            />

            <div class="candidate-name">เด็กหญิงนิชากร พลับพลา</div>

            <div class="vote-count" id="score1">0</div>

            <div class="vote-label">คะแนน</div>
          </div>

          <!-- Candidate 2 -->
          <div class="candidate-card">
            <div class="candidate-number" style="background: #dc2626">2</div>

            <img
              src="img/profile2.png"
              class="candidate-image"
            />

            <div class="candidate-name">เด็กหญิงใยแก้ว</div>

            <div class="vote-count" id="score2">0</div>

            <div class="vote-label">คะแนน</div>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="side-panel">
          <!-- Total -->
          <div class="panel total-vote">
            <div class="panel-title">👥 จำนวนผู้โหวตทั้งหมด</div>

            <div class="total-number" id="totalVote">0</div>
          </div>

          <!-- Recent -->
          <div class="panel">
            <div class="panel-title">⚡ Realtime Activity</div>

            <div class="recent-list" id="recentList"></div>
          </div>
        </div>
      </div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

      import {
        getDatabase,
        ref,
        onValue,
        onChildAdded,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      // =====================================
      // FIREBASE CONFIG
      // =====================================

      const firebaseConfig = {
        apiKey: "AIzaSyBNzWS5gzCkjx8FOcFrp_019c4jJizKk4M",

        authDomain: "vote-tpk.firebaseapp.com",

        databaseURL:
          "https://vote-tpk-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId: "vote-tpk",

        storageBucket: "vote-tpk.appspot.com",

        messagingSenderId: "1032155013508",

        appId: "1:1032155013508:web:a7c90830e92366afba7dd1",
      };

      // =====================================
      // INIT
      // =====================================

      const app = initializeApp(firebaseConfig);

      const db = getDatabase(app);

      // =====================================
      // SCORE REALTIME
      // =====================================

      const votesRef = ref(db, "votes");

      onValue(votesRef, (snapshot) => {
        const data = snapshot.val() || {};

        const c1 = data.candidate1 || 0;

        const c2 = data.candidate2 || 0;

        document.getElementById("score1").innerText = c1;

        document.getElementById("score2").innerText = c2;

        document.getElementById("totalVote").innerText = c1 + c2;
      });

      // =====================================
      // RECENT REALTIME
      // =====================================

      const recentList = document.getElementById("recentList");

      const logsRef = ref(db, "votes");

      onChildAdded(logsRef, (snapshot) => {
        const data = snapshot.val();
        console.log(data);
        if (data.time) {
          const date = new Date(data.time);
          const timeText = date.toLocaleString("th-TH");
          const div = document.createElement("div");
          div.className = "recent-item";
          div.innerHTML = `

    <div class="check">
      ✓
    </div>

    <div>
      มีผู้ใช้โหวตแล้ว
      <br>

      <small style="
        color:#94a3b8;
      ">
        ${timeText}
      </small>
    </div>

  `;

          recentList.prepend(div);
        }
      });
    </script>
  </body>
</html>
