<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <title>Realtime Vote Counter</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Kanit", sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #0f172a, #1e293b);

        color: white;

        font-family: sans-serif;

        height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        overflow: hidden;
      }

      .counter-box {
        text-align: center;

        padding: 60px;

        border-radius: 40px;

        background: rgba(255, 255, 255, 0.08);

        backdrop-filter: blur(15px);

        box-shadow: 0 8px 40px rgba(0, 0, 0, 0.25);

        min-width: 500px;
      }

      .title {
        font-size: 42px;

        font-weight: 700;

        margin-bottom: 20px;

        letter-spacing: 2px;
      }

      .counter {
        font-size: 180px;

        font-weight: bold;

        line-height: 1;

        color: #4ade80;

        transition: 0.2s;
      }

      .subtitle {
        margin-top: 25px;

        font-size: 28px;

        color: #cbd5e1;
      }

      .pulse {
        animation: pulse 0.4s;
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }

        50% {
          transform: scale(1.08);
        }

        100% {
          transform: scale(1);
        }
      }
    </style>
  </head>
  <body>
    <div class="counter-box">
      <div class="title">🗳️ จำนวนผู้มาใช้สิทธิ์</div>

      <div class="counter" id="counter">0</div>

      <div class="subtitle">คน</div>
    </div>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

      import {
        getDatabase,
        ref,
        onValue,
        push,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      // =====================================
      // FIREBASE CONFIG
      // =====================================

      const firebaseConfig = {
        apiKey: "AIzaSyBNzWS5gzCkjx8FOcFrp_019c4jJizKk4M",

        authDomain: "vote-tpk.firebaseapp.com",

        databaseURL:
          "https://vote-tpk-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId: "vote-tpk",

        storageBucket: "vote-tpk.appspot.com",

        messagingSenderId: "1032155013508",

        appId: "1:1032155013508:web:a7c90830e92366afba7dd1",
      };

      // =====================================
      // INIT
      // =====================================

      const app = initializeApp(firebaseConfig);

      const db = getDatabase(app);

      // =====================================
      // REALTIME COUNTER
      // =====================================

      const counter = document.getElementById("counter");

      const voteRef = ref(db, "votes");

      onValue(voteRef, (snapshot) => {
        const data = snapshot.val();

        console.log(data);

        const total = data ? Object.keys(data).length : 0;

        counter.innerText = total;

        // animation
        counter.classList.remove("pulse");

        void counter.offsetWidth;

        counter.classList.add("pulse");
      });
    </script>
  </body>
</html>
