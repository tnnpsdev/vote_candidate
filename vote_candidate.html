<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>เลือกตั้งประธานนักเรียน</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Kanit", sans-serif;
      }

      body {
        background: linear-gradient(135deg, #fdf6f0, #f7f4ff, #eef7ff);

        min-height: 100vh;
        color: #4b5563;
      }

      .page {
        display: none;
        min-height: 100vh;
        justify-content: center;
        align-items: center;
        padding: 30px;
      }

      .page.active {
        display: flex;
      }

      .main-card {
        width: 100%;
        max-width: 1150px;

        background: rgba(255, 255, 255, 0.75);

        backdrop-filter: blur(14px);

        border: 1px solid rgba(255, 255, 255, 0.6);

        border-radius: 34px;

        padding: 50px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      }

      .title {
        text-align: center;
        font-size: 48px;
        font-weight: 700;
        color: #5b5568;
        margin-bottom: 12px;
      }

      .subtitle {
        text-align: center;
        font-size: 18px;
        color: #8b8596;
        margin-bottom: 45px;
      }

      .start-btn {
        border: none;

        background: linear-gradient(135deg, #d8c7ff, #c8e7ff);

        color: #4b5563;

        padding: 18px 50px;

        font-size: 22px;
        font-weight: 600;

        border-radius: 18px;

        transition: 0.3s;
      }

      .start-btn:hover {
        transform: translateY(-4px);

        box-shadow: 0 10px 25px rgba(180, 180, 255, 0.35);
      }

      .candidate-card {
        background: white;

        border-radius: 30px;

        overflow: hidden;

        transition: 0.35s;

        border: 1px solid #f2f2f2;

        height: 100%;
      }

      /* .candidate-card:hover {
        transform: translateY(-8px);

        box-shadow: 0 16px 35px rgba(0, 0, 0, 0.08);
      } */

      .candidate-img {
        width: 100%;
        height: 350px;
        object-fit: cover;
      }

      .candidate-body {
        padding: 28px;
        text-align: center;
      }

      .candidate-number {
        width: 68px;
        height: 68px;

        border-radius: 50%;

        display: flex;
        justify-content: center;
        align-items: center;

        margin: -62px auto 24px;

        position: relative;

        color: white;

        font-size: 28px;
        font-weight: 700;

        border: 5px solid white;

        background: #cdb4db;
      }

      .candidate-number.second {
        background: #a0c4ff;
      }

      .candidate-name {
        font-size: 30px;
        font-weight: 700;
        color: #4b5563;
        margin-bottom: 10px;
      }

      .candidate-policy {
        color: #8b8596;
        font-size: 16px;
        margin-bottom: 24px;
      }

      .vote-btn {
        border: none;

        border-radius: 16px;

        padding: 14px;

        font-size: 20px;
        font-weight: 600;

        transition: 0.3s;
      }

      .vote-btn-1 {
        background: #e9d5ff;
        color: #5b5568;
      }

      .vote-btn-1:hover {
        background: #dcc2ff;
      }

      .vote-btn-2 {
        background: #cfe8ff;
        color: #4b5563;
      }

      .vote-btn-2:hover {
        background: #b8dcff;
      }

      .modal-content {
        border: none;
        border-radius: 28px;
        overflow: hidden;
      }

      .modal-body {
        padding: 50px 35px;
      }

      .success-icon {
        font-size: 75px;
      }

      .finish-btn {
        border: none;

        background: linear-gradient(135deg, #d8c7ff, #c8e7ff);

        color: #4b5563;

        padding: 12px 40px;

        border-radius: 14px;

        font-size: 18px;
        font-weight: 600;
      }

      .finish-btn:hover {
        opacity: 0.9;
      }

      @media (max-width: 768px) {
        .main-card {
          padding: 30px 22px;
        }

        .title {
          font-size: 34px;
        }

        .candidate-name {
          font-size: 24px;
        }

        .candidate-img {
          height: 280px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page active" id="votePage">
      <div class="main-card">
        <div class="row g-4">
          <!-- Candidate 1 -->
          <div class="col-md-6">
            <div class="candidate-card">
              <img
                class="candidate-img"
                src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?q=80&w=1200&auto=format&fit=crop"
                onclick="vote('Tinnakorn')"
              />

              <div class="candidate-body">
                <div class="candidate-number">1</div>

                <div class="candidate-name">นายทินกร ปทุมสูติ</div>

                <div class="candidate-policy">
                  “พัฒนาโรงเรียนให้ทันสมัย และเพิ่มกิจกรรมสร้างสรรค์”
                </div>

                <button
                  class="vote-btn vote-btn-1 w-100"
                  onclick="vote('Tinnakorn')"
                  id="btn1"
                >
                  โหวตเบอร์ 1
                </button>
              </div>
            </div>
          </div>

          <!-- Candidate 2 -->
          <div class="col-md-6">
            <div class="candidate-card">
              <img
                class="candidate-img"
                src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=1200&auto=format&fit=crop"
                onclick="vote('Jutarat')"
              />

              <div class="candidate-body">
                <div class="candidate-number second">2</div>

                <div class="candidate-name">นางสาวจุฑารัตน์ คชรณ</div>

                <div class="candidate-policy">
                  “รับฟังทุกความคิดเห็น และสร้างโรงเรียนแห่งความสุข”
                </div>

                <button
                  class="vote-btn vote-btn-2 w-100"
                  onclick="vote('Jutarat')"
                  id="btn2"
                >
                  โหวตเบอร์ 2
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div
      class="modal fade"
      id="voteModal"
      tabindex="-1"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center">
            <div class="success-icon mb-3">✔️</div>

            <h2 class="fw-bold mb-3">บันทึกการโหวตสำเร็จ</h2>

            <div class="countdown mt-3">
              ปิดอัตโนมัติใน <span id="timer">10</span> วินาที
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Loading Modal -->
    <div
      class="modal fade"
      id="loadingModal"
      tabindex="-1"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content">
          <div class="modal-body text-center py-5">
            <div
              class="spinner-border mb-4"
              style="width: 4rem; height: 4rem; color: #6666ba"
            ></div>

            <h3 class="fw-bold">กำลังบันทึกข้อมูล...</h3>

            <div class="text-muted mt-2">กรุณารอสักครู่</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      let voted = false;

      const voteModal = new bootstrap.Modal(
        document.getElementById("voteModal"),
      );

      const loadingModal = new bootstrap.Modal(
        document.getElementById("loadingModal"),
      );

      async function vote(candidateName) {
        // ป้องกันกดซ้ำ
        if (voted) {
          return;
        }

        voted = true;

        loadingModal.show();
        await sendVote(candidateName);
        loadingModal.hide();
        voteModal.show();

        let timeLeft = 5;
        const timer = document.getElementById("timer");
        timer.innerText = timeLeft;

        const countdown = setInterval(() => {
          timeLeft--;
          timer.innerText = timeLeft;

          if (timeLeft <= 0) {
            clearInterval(countdown);
            finishVote();
          }
        }, 1000);
      }

      function finishVote() {
        voteModal.hide();
        // reset
        voted = false;
      }

      async function sendVote(candidateName) {
        try {
          const response = await fetch(
            "https://script.google.com/macros/s/AKfycbzP4s3sFVwiKznRLPB099VOixc5WuWaBZyCr93oH06hIw7iBC_QjzjksPQ1hV3fJtnH/exec",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/x-www-form-urlencoded",
              },
              body: JSON.stringify({
                name: candidateName,
              }),
            },
          );

          // ตรวจสอบ status
          if (!response.ok) {
            throw new Error("API Error");
          }
        } catch (error) {
          console.error(error);

          alert(error.message);
        }
      }
    </script>
  </body>
</html>
