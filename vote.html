<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <title>Election Vote</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      * {
        font-family: "Kanit", sans-serif;
        touch-action: pan-y;
      }

      body {
        margin: 0;

        min-height: 100vh;

        background: linear-gradient(135deg, #0f172a, #111827, #1e293b);

        overflow: hidden;

        color: white;
      }

      .bg-glow {
        position: fixed;

        width: 500px;
        height: 500px;

        border-radius: 50%;

        filter: blur(120px);

        opacity: 0.15;

        z-index: 0;
      }

      .glow1 {
        background: #3b82f6;
        top: -150px;
        left: -150px;
      }

      .glow2 {
        background: #22c55e;
        bottom: -150px;
        right: -150px;
      }

      .main-container {
        position: relative;

        z-index: 1;

        min-height: 100vh;

        display: flex;

        flex-direction: column;

        justify-content: center;

        padding: 40px;
      }

      .header {
        text-align: center;

        margin-bottom: 50px;
      }

      .title {
        font-size: 64px;

        font-weight: 800;

        letter-spacing: 2px;
      }

      .subtitle {
        margin-top: 10px;

        font-size: 24px;

        color: #cbd5e1;
      }

      .candidate-wrapper {
        display: flex;

        gap: 35px;

        justify-content: center;

        flex-wrap: wrap;
      }

      .candidate-card {
        width: 420px;

        background: rgba(255, 255, 255, 0.08);

        border: 2px solid rgba(255, 255, 255, 0.08);

        border-radius: 40px;

        padding: 35px;

        text-align: center;

        backdrop-filter: blur(20px);

        transition: 0.25s;

        cursor: pointer;

        position: relative;

        overflow: hidden;
      }

      .candidate-card:hover {
        transform: translateY(-8px);

        border-color: rgba(74, 222, 128, 0.5);
      }

      .candidate-card.active {
        border: 3px solid #4ade80;

        box-shadow: 0 0 30px rgba(74, 222, 128, 0.35);
      }

      .candidate-number {
        position: absolute;

        top: 25px;
        left: 25px;

        width: 75px;
        height: 75px;

        border-radius: 22px;

        background: #2563eb;

        display: flex;
        align-items: center;
        justify-content: center;

        font-size: 36px;
        font-weight: bold;
      }

      .candidate-image {
        width: 230px;
        height: 230px;

        object-fit: cover;

        border-radius: 50%;

        border: 8px solid rgba(255, 255, 255, 0.12);

        margin-bottom: 25px;
      }

      .candidate-name {
        font-size: 32px;

        font-weight: 700;

        margin-bottom: 10px;
      }

      .candidate-desc {
        color: #cbd5e1;

        font-size: 20px;
      }

      .confirm-section {
        margin-top: 45px;

        text-align: center;
      }

      .btn-confirm {
        border: none;

        padding: 20px 80px;

        border-radius: 22px;

        font-size: 30px;

        font-weight: 700;

        background: linear-gradient(135deg, #22c55e, #16a34a);

        color: white;

        transition: 0.2s;

        box-shadow: 0 10px 30px rgba(34, 197, 94, 0.35);
      }

      .btn-confirm:hover {
        transform: scale(1.04);
      }

      .btn-confirm:disabled {
        opacity: 0.4;

        cursor: not-allowed;

        transform: none;
      }

      .selected-text {
        margin-bottom: 20px;

        font-size: 24px;

        color: #cbd5e1;
      }
    </style>
  </head>
  <body>
    <div class="bg-glow glow1"></div>
    <div class="bg-glow glow2"></div>

    <div class="main-container">
      <div class="candidate-wrapper">
        <!-- Candidate 1 -->
        <div class="candidate-card" onclick="selectCandidate(1)" id="card1">
          <div class="candidate-number">1</div>

          <img src="img/profile1.png" class="candidate-image" />

          <div class="candidate-name">เด็กหญิงนิชากร พลับพลา</div>

          <div class="candidate-desc">พรรคเพื่อน้อง พี่พร้อมพัฒนา</div>
        </div>

        <!-- Candidate 2 -->
        <div class="candidate-card" onclick="selectCandidate(2)" id="card2">
          <div class="candidate-number" style="background: #dc2626">2</div>

          <img src="img/profile2.png" class="candidate-image" />

          <div class="candidate-name">เด็กหญิงใยแก้ว</div>
          
          <div class="candidate-desc">การเรียนเป็นหลัก สนุกเป็นเกณฑ์<br>เกรดเฉลี่ยเป็นเลิศ</div>
        </div>
      </div>

      <!-- Confirm -->
      <div class="confirm-section">
        <div class="selected-text" id="selectedText">
          ยังไม่ได้เลือกผู้สมัคร
        </div>

        <button
          class="btn-confirm"
          id="confirmBtn"
          disabled
          onclick="confirmVote()"
        >
          ✅ ยืนยันการโหวต
        </button>
      </div>
    </div>

    <!-- SUCCESS MODAL -->

    <div
      class="modal fade"
      id="successModal"
      data-bs-backdrop="static"
      data-bs-keyboard="false"
      tabindex="-1"
    >
      <div class="modal-dialog modal-dialog-centered">
        <div
          class="modal-content"
          style="
            background: #0f172a;
            color: white;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.1);
          "
        >
          <div class="modal-body text-center py-5">
            <div
              style="
                width: 110px;
                height: 110px;
                margin: auto;
                border-radius: 50%;
                background: #22c55e;

                display: flex;
                align-items: center;
                justify-content: center;

                font-size: 60px;
                font-weight: bold;

                margin-bottom: 25px;
              "
            >
              ✓
            </div>

            <h2 style="font-weight: 700; margin-bottom: 15px">โหวตสำเร็จ</h2>

            <div style="color: #cbd5e1; font-size: 20px">
              ขอบคุณสำหรับการใช้สิทธิ์เลือกตั้ง
            </div>

            <div
              id="countdownText"
              style="margin-top: 25px; color: #94a3b8; font-size: 18px"
            >
              ปิดอัตโนมัติใน <front id="countNum"></front> วินาที
            </div>
          </div>
        </div>
      </div>
    </div>

    <input type="hidden" id="selectCandidate" />

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

      import {
        getDatabase,
        ref,
        runTransaction,
        push,
      } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

      // =====================================
      // FIREBASE CONFIG
      // =====================================

      const firebaseConfig = {
        apiKey: "AIzaSyBNzWS5gzCkjx8FOcFrp_019c4jJizKk4M",

        authDomain: "vote-tpk.firebaseapp.com",

        databaseURL:
          "https://vote-tpk-default-rtdb.asia-southeast1.firebasedatabase.app",

        projectId: "vote-tpk",

        storageBucket: "vote-tpk.appspot.com",

        messagingSenderId: "1032155013508",

        appId: "1:1032155013508:web:a7c90830e92366afba7dd1",
      };

      // =====================================
      // INIT FIREBASE
      // =====================================

      const app = initializeApp(firebaseConfig);

      const db = getDatabase(app);

      // =====================================
      // SELECT CANDIDATE
      // =====================================

      let selectedCandidate = null;

      window.selectCandidate = function (number) {
        selectedCandidate = number;

        document.querySelectorAll(".candidate-card").forEach((card) => {
          card.classList.remove("active");
        });

        document.getElementById("card" + number).classList.add("active");

        document.getElementById("confirmBtn").disabled = false;

        document.getElementById("selectedText").innerText =
          "เลือก Candidate " + number;
      };

      // =====================================
      // CONFIRM VOTE
      // =====================================

      window.confirmVote = async function () {
        if (!selectedCandidate) return;

        // map candidate
        const candidate = selectedCandidate === 1 ? "candidate1" : "candidate2";

        try {
          // ================================
          // UPDATE SCORE
          // ================================

          const candidateRef = ref(db, "votes/" + candidate);

          await runTransaction(candidateRef, (currentValue) => {
            return (currentValue || 0) + 1;
          });

          // ================================
          // ADD LOG
          // ================================

          await push(ref(db, "votes"), {
            candidate: candidate,
            time: Date.now(),
          });

          // ================================
          // SUCCESS
          // ================================

          // ================================
          // SUCCESS MODAL
          // ================================

          const modal = new bootstrap.Modal(
            document.getElementById("successModal"),
          );

          modal.show();

          // countdown
          let countdown = 5;

          const countNum = document.getElementById("countNum");
          countNum.textContent = countdown; 

          const timer = setInterval(() => {
            countdown--;

            countNum.textContent = countdown; 

            if (countdown <= 0) {
              clearInterval(timer);

              modal.hide();
            }
          }, 1000);

          // reset ui
          selectedCandidate = null;

          document.querySelectorAll(".candidate-card").forEach((card) => {
            card.classList.remove("active");
          });

          document.getElementById("confirmBtn").disabled = true;

          document.getElementById("selectedText").innerText =
            "ยังไม่ได้เลือกผู้สมัคร";
        } catch (error) {
          console.error(error);

          alert("เกิดข้อผิดพลาด");
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
